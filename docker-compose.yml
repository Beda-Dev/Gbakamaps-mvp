services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # "127.0.0.1:PORT:5432" (pas juste "PORT:5432") : sans le préfixe
      # d'adresse, Docker publie sur TOUTES les interfaces (0.0.0.0) — sur
      # un vrai serveur (pas cette machine de dev), Postgres serait alors
      # directement joignable depuis Internet, les identifiants de la base
      # devenant la seule protection. Le backend, lui, atteint toujours `db`
      # par le réseau Docker interne (DATABASE_URL="...@db:5432/..."), jamais
      # par ce port publié — ce mapping ne sert qu'à un accès local
      # (psql/DBeaver) depuis la machine hôte elle-même. Trouvé en auditant
      # le projet le 2026-09-09, jamais remarqué avant (fonctionnait "par
      # hasard" en dev, aucun accès distant testé).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_API_KEY_2: ${ORS_API_KEY_2}
      GRAPHHOPPER_API_KEY: ${GRAPHHOPPER_API_KEY}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2}
      # ${VAR:-défaut} (pas juste ${VAR}) : une variable absente de .env
      # deviendrait sinon une CHAÎNE VIDE transmise au conteneur, qui
      # échouerait le `.min(1)` de env.ts au lieu de déclencher son
      # `.default()` (piège déjà documenté sur GRAPHHOPPER_API_KEY,
      # PROJECT_MEMORY.md — ici évité directement plutôt que reproduit).
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      MAPILLARY_ACCESS_TOKEN: ${MAPILLARY_ACCESS_TOKEN}
    ports:
      - "${PORT:-4000}:4000"
    # Reprend le HEALTHCHECK déjà défini dans le Dockerfile (Compose n'en a
    # pas besoin pour fonctionner, mais l'expliciter ici documente le
    # comportement sans avoir à ouvrir le Dockerfile, et permettra un futur
    # `depends_on: backend: condition: service_healthy` si un service en
    # dépend un jour).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      # Photos communautaires (§9/§12.8) : un volume nommé persistant, pas
      # un simple dossier dans l'image — sinon perdu à chaque rebuild
      # (`docker compose up -d --build`, déjà une routine fréquente de ce
      # projet après tout ajout de route, cf. PROJECT_MEMORY.md).
      - backend_uploads:/app/uploads

volumes:
  db_data:
    name: gbakamap_db_data
  backend_uploads:
    name: gbakamap_backend_uploads
